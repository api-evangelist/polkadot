openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Vesting API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Vesting
paths:
  /api/scan/vesting_release:
    post:
      description: Returns vesting release records for the requested date range. This endpoint is available only on networks that support the vesting frame.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.VestingRelease'
                          type: array
                      type: object
                  type: object
      summary: List vesting release records
      tags:
      - Vesting
      x-synonyms:
      - vesting
      - release
      - scan
      - lockup
      - unlock schedule
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.vestingReleaseParams'
        description: params
        required: true
components:
  schemas:
    subscan_internal_model.VestingRelease:
      properties:
        amount:
          type: string
        block_num:
          type: integer
        day:
          type: string
      type: object
    internal_server_http.vestingReleaseParams:
      properties:
        end:
          example: '2023-06-01'
          type: string
        start:
          example: '2023-05-01'
          type: string
      required:
      - end
      - start
      type: object
    internal_server_http.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
