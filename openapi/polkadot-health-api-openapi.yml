openapi: 3.2.0
info:
  title: Polkadot Health API
  version: '1.0'
  description: 'Operations tagged health across 2 of this provider''s published API definitions: polkadot-rest-api-openapi.json, subscan-swagger.yaml. Each path carries the servers of the definition it was published in.'
servers:
- url: http://localhost:8080/v1
  description: Localhost
- url: https://https://www.subscan.io/
tags:
- name: health
  description: Health check
paths:
  /v1/health:
    get:
      tags:
      - health
      summary: Health check
      description: Returns the health status of the API server.
      operationId: get_health
      responses:
        '202':
          description: API is healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
    servers:
    - url: http://localhost:8080/v1
      description: Localhost
  /healthz:
    get:
      description: Returns OK when the service process is alive.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
      summary: Liveness health check
      tags:
      - health
      x-synonyms:
      - liveness
      - health
      - check
      - healthz
    servers:
    - url: https://https://www.subscan.io/
  /readiness:
    get:
      description: Returns OK when the service is ready to serve traffic.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: string
      summary: Readiness health check
      tags:
      - health
      x-synonyms:
      - readiness
      - health
      - check
    servers:
    - url: https://https://www.subscan.io/
components:
  schemas:
    HealthResponse:
      type: object
      required:
      - status
      properties:
        connected_chains:
          type:
          - integer
          - 'null'
          minimum: 0
        status:
          type: string
        uptime:
          type:
          - integer
          - 'null'
          format: int64
          minimum: 0
x-refined-from:
- polkadot-rest-api-openapi.json
- subscan-swagger.yaml
