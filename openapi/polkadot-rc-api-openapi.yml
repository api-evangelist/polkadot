components:
  schemas:
    EraPayoutsData:
      type: object
      description: Actual payout data for an era
      required:
      - era
      - totalEraRewardPoints
      - totalEraPayout
      - payouts
      properties:
        era:
          type: string
          description: Era index
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/ValidatorPayout'
          description: Individual payouts for validators nominated
        totalEraPayout:
          type: string
          description: Total payout for the era
        totalEraRewardPoints:
          type: string
          description: Total reward points for the era
    BlockInfo:
      type: object
      description: Block information
      required:
      - hash
      - height
      properties:
        hash:
          type: string
        height:
          type: string
    TransactionPoolResponse:
      type: object
      required:
      - pool
      properties:
        pool:
          type: array
          items:
            $ref: '#/components/schemas/TransactionPoolEntry'
    FeeEstimateResponse:
      type: object
      required:
      - weight
      - class
      - partialFee
      properties:
        class:
          type: string
        partialFee:
          type: string
        weight:
          $ref: '#/components/schemas/Weight'
    NodeVersionResponse:
      type: object
      required:
      - clientVersion
      - clientImplName
      - chain
      properties:
        chain:
          type: string
        clientImplName:
          type: string
        clientVersion:
          type: string
    RewardDestination:
      oneOf:
      - type: object
        description: Rewards are automatically re-staked
        required:
        - staked
        properties:
          staked:
            default: null
      - type: object
        description: Rewards are sent to the stash account
        required:
        - stash
        properties:
          stash:
            default: null
      - type: object
        description: Rewards are sent to the controller account
        required:
        - controller
        properties:
          controller:
            default: null
      - type: object
        description: No reward destination
        required:
        - none
        properties:
          none:
            default: null
      - type: object
        description: Rewards are sent to a specific account
        required:
        - account
        properties:
          account:
            type: string
            description: Rewards are sent to a specific account
      description: 'Reward destination - e.g. { "staked": null }, { "stash": null }, { "account": "..." }'
    BalanceLock:
      type: object
      description: Balance lock information
      required:
      - id
      - amount
      - reasons
      properties:
        amount:
          type: string
          description: Amount locked
        id:
          type: string
          description: Lock identifier
        reasons:
          type: string
          description: Lock reasons (Fee = 0, Misc = 1, All = 2)
    TransactionPoolEntry:
      type: object
      required:
      - hash
      - encodedExtrinsic
      properties:
        encodedExtrinsic:
          type: string
        hash:
          type: string
        partialFee:
          type:
          - string
          - 'null'
        priority:
          type:
          - string
          - 'null'
        tip:
          type:
          - string
          - 'null'
    RcProxyInfoResponse:
      type: object
      description: Response for GET /rc/accounts/{accountId}/proxy-info
      required:
      - at
      - delegatedAccounts
      - depositHeld
      properties:
        at:
          $ref: '#/components/schemas/BlockInfo'
        delegatedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ProxyDefinition'
          description: Array of delegated accounts with their proxy definitions
        depositHeld:
          type: string
          description: The deposit held for the proxies
    ClaimedReward:
      type: object
      description: Claimed reward status for a specific era
      required:
      - era
      - status
      properties:
        era:
          type: string
          description: Era index
        status:
          type: string
          description: Claim status ("claimed" or "unclaimed")
    ParseError:
      type: object
      description: Error response for transaction parsing failures.
      required:
      - code
      - error
      - transaction
      - cause
      - stack
      properties:
        cause:
          type: string
          description: Cause of the error
        code:
          type: integer
          format: int32
          description: HTTP status code
          example: 400
          minimum: 0
        error:
          type: string
          description: Error message
          example: Failed to parse transaction.
        stack:
          type: string
          description: Stack trace
        transaction:
          type: string
          description: The transaction that failed to parse
    VestingSchedule:
      type: object
      description: A vesting schedule
      required:
      - locked
      - perBlock
      - startingBlock
      properties:
        locked:
          type: string
          description: Total tokens locked at start of vesting
        perBlock:
          type: string
          description: Tokens unlocked per block
        startingBlock:
          type: string
          description: Block when vesting begins
    ParseRequest:
      type: object
      description: Request body for transaction parsing.
      properties:
        tx:
          type:
          - string
          - 'null'
          description: Hex-encoded extrinsic with optional 0x prefix.
          example: 0x4902840004316d995f...
    RcBalanceInfoResponse:
      type: object
      description: Response for GET /rc/accounts/{accountId}/balance-info
      required:
      - at
      - nonce
      - tokenSymbol
      - free
      - reserved
      - miscFrozen
      - feeFrozen
      - frozen
      - transferable
      - locks
      properties:
        at:
          $ref: '#/components/schemas/BlockInfo'
        feeFrozen:
          type: string
          description: 'The amount that free may not drop below when withdrawing specifically for

            transaction fee payment (legacy field, may be string message for newer runtimes)'
        free:
          type: string
          description: Free balance (not equivalent to spendable balance)
        frozen:
          type: string
          description: Frozen balance (newer runtimes, may be string message for older runtimes)
        locks:
          type: array
          items:
            $ref: '#/components/schemas/BalanceLock'
          description: Array of balance locks
        miscFrozen:
          type: string
          description: 'The amount that free may not drop below when withdrawing for anything except

            transaction fee payment (legacy field, may be string message for newer runtimes)'
        nonce:
          type: string
          description: Account nonce
        reserved:
          type: string
          description: Reserved balance
        tokenSymbol:
