        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        count:
                          type: integer
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.AccountReferendumJson'
                          type: array
                      type: object
                  type: object
      summary: List governance items for an account
      tags:
      - Governance
      x-synonyms:
      - account
      - referendum
      - governance
      - scan
      - wallet
      - address
      - user
      - vote
      - treasury
      - council
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.accountReferendumParams'
        description: params
        required: true
