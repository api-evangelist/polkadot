openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Stat API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Stat
paths:
  /api/scan/accounts/mau:
    post:
      description: Returns monthly active account statistics for the requested date range.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.MonthStatistics'
                          type: array
                      type: object
                  type: object
      summary: Get monthly active account statistics
      tags:
      - Stat
      x-synonyms:
      - monthly
      - active
      - account
      - statistics
      - stat
      - scan
      - accounts
      - mau
      - wallet
      - address
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.accountsMAUHandleParams'
        description: params
        required: true
  /api/scan/daily_token:
    post:
      description: Returns daily token statistics for a date range and optional token symbol.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.DailyTokenStatusJson'
                          type: array
                      type: object
                  type: object
      summary: Get daily token statistics
      tags:
      - Stat
      x-synonyms:
      - daily
      - token
      - statistics
      - stat
      - scan
      - asset
      - coin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.dailyTokenStatParams'
        description: params
        required: true
  /api/scan/price/history:
    post:
      description: Returns token price history and EMA metrics for the selected date range and format.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        ema7_average:
                          type: string
                        ema30_average:
                          type: string
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_service_scan.Price'
                          type: array
                      type: object
                  type: object
      summary: Get token price history
      tags:
      - Stat
      x-synonyms:
      - token
      - price
      - history
      - stat
      - scan
      - asset
      - coin
      - rate
      - valuation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.priceHistoryParams'
        description: params
        required: true
  /api/v2/scan/daily:
    post:
      description: Returns daily aggregated chain statistics for the selected category and date range.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.DailyStaticJsonV2'
                          type: array
                      type: object
                  type: object
      summary: Get daily statistics (v2)
      tags:
      - Stat
      x-synonyms:
      - daily
      - statistics
      - stat
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.dailyStatV2Param'
        description: param
        required: true
components:
  schemas:
    internal_server_http.dailyStatV2Param:
      properties:
        category:
          type: string
        end:
          example: '2023-06-01'
          type: string
        format:
          enum:
          - day
          - hour
          - 6hour
          - minute
          - 7d
          - month
          - year
          type: string
        start:
          example: '2023-05-01'
          type: string
      required:
      - end
      - start
      type: object
    internal_server_http.priceHistoryParams:
      properties:
        currency:
          type: string
        end:
          example: '2023-06-01'
          type: string
        format:
          enum:
          - day
          - hour
          - 6hour
          - 12hour
          type: string
        start:
          example: '2023-05-01'
          type: string
      required:
      - end
      - start
      type: object
    subscan_internal_model.OtherDetail:
      properties:
        conviction_locked_balance:
          type: string
        democracy_locked_balance:
          type: string
        election_locked_balance:
          type: string
        nominator_bonded:
          type: string
        reserved_balance:
          type: string
        unbonded_locked_balance:
          type: string
        validator_bonded:
          type: string
        vesting_balance:
          type: string
      type: object
    subscan_internal_model.SampleIdentity:
      properties:
        display:
          type: string
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        parent:
          $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
      type: object
    subscan_internal_model.MonthStatistics:
      properties:
        active_account:
          type: integer
        time_utc:
          type: string
      type: object
    subscan_internal_model.AccountParentJson:
      properties:
        address:
          type: string
        display:
          type: string
        identity:
          type: boolean
        sub_symbol:
          type: string
      type: object
    subscan_internal_model.EvmAccountDisplay:
      properties:
        contract_name:
          type: string
        verify_source:
          type: string
      type: object
    internal_server_http.dailyTokenStatParams:
      properties:
        end:
          example: '2023-06-01'
          type: string
        format:
          enum:
          - day
          type: string
        start:
          example: '2023-05-01'
          type: string
        symbol:
          type: string
      required:
      - end
      - start
      type: object
    subscan_internal_model.AccountDisplay:
      properties:
        account_index:
          type: string
        address:
          description: Current network account
          type: string
        display:
          type: string
        evm_address:
          type: string
        evm_contract:
          $ref: '#/components/schemas/subscan_internal_model.EvmAccountDisplay'
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        merkle:
          $ref: '#/components/schemas/subscan_internal_model.MerkleTag'
        parent:
          allOf:
          - $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
          description: Parent account
        people:
          $ref: '#/components/schemas/subscan_internal_model.SampleIdentity'
      type: object
    subscan_internal_model.DailyStaticJsonV2:
      properties:
        time_utc:
          type: string
        total:
          type: string
        transfer_amount:
          type: string
      type: object
    internal_server_http.accountsMAUHandleParams:
      properties:
        end:
          example: '2025-07-25'
          type: string
        start:
          example: '2025-07-22'
          type: string
      required:
      - end
      - start
      type: object
    subscan_internal_model.MerkleTag:
      properties:
        address_type:
          type: string
        tag_name:
          type: string
        tag_subtype:
          type: string
        tag_type:
          type: string
      type: object
    subscan_internal_model.DailyTokenStatusJson:
      properties:
        available:
          type: string
        other:
          type: string
        other_details:
          $ref: '#/components/schemas/subscan_internal_model.OtherDetail'
        staking:
          type: string
        system_accounts:
          items:
            $ref: '#/components/schemas/subscan_internal_model.AccountBalanceDetailJson'
          type: array
        time_utc:
          type: string
        total_issuance:
          type: string
        treasury_amount:
          type: string
      type: object
    subscan_internal_model.AccountBalanceDetailJson:
      properties:
        account_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        address:
          type: string
        balance:
          type: string
      type: object
    subscan_internal_service_scan.Price:
      properties:
        feed_at:
          type: integer
        price:
          type: string
      type: object
    subscan_internal_model.RegistrationJudgementJson:
      properties:
        index:
          type: integer
        judgement:
          type: string
      type: object
    internal_server_http.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
