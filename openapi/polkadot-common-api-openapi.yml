openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Common API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Common
paths:
  /api/now:
    get:
      description: Returns the current server timestamp in Unix seconds.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      type: integer
                  type: object
      summary: Get current timestamp
      tags:
      - Common
      x-synonyms:
      - now
      - timestamp
components:
  schemas:
    internal_server_http.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
