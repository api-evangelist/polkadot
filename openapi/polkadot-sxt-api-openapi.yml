openapi: 3.1.0
info:
  title: Polkadot REST Account Sxt API
  description: High-performance Rust REST API for Substrate/Polkadot blockchain data. Drop-in replacement for substrate-api-sidecar.
  contact:
    url: https://github.com/paritytech/polkadot-rest-api
  license:
    name: GPL-3.0-or-later
  version: 0.1.3
servers:
- url: http://localhost:8080/v1
  description: Localhost
tags:
- name: Sxt
paths:
  /api/scan/sxt/holders:
    post:
      consumes:
      - application/json
      description: This API is only available for sxt network.
      parameters:
      - description: body
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_plugin_spaceTime_http.holderParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/subscan_internal_plugin_share.J'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_plugin_spaceTime_db.Holder'
                      type: array
                  type: object
              type: object
      summary: sxt evm holder list
      tags:
      - Sxt
      x-synonyms:
      - sxt
      - evm
      - holder
      - scan
      - holders
      - ethereum
      - smart contract
      - frontier
      - owner
      - balance holder
      - owners
      - token holders
  /api/scan/sxt/transfers:
    post:
      consumes:
      - application/json
      description: This API is only available for sxt network.
      parameters:
      - description: body
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_plugin_spaceTime_http.transferParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/subscan_internal_plugin_share.J'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_plugin_spaceTime_db.TransferJson'
                      type: array
                  type: object
              type: object
      summary: sxt evm transfer list
      tags:
      - Sxt
      x-synonyms:
      - sxt
      - evm
      - transfer
      - scan
      - transfers
      - ethereum
      - smart contract
      - frontier
      - send
      - asset movement
definitions:
  internal_plugin_spaceTime_http.transferParams:
    properties:
      address:
        type: string
      after_id:
        type: integer
      page:
        minimum: 0
        type: integer
      receiver:
        type: string
      row:
        maximum: 100
        minimum: 1
        type: integer
      sender:
        type: string
    type: object
  subscan_internal_plugin_spaceTime_db.TransferJson:
    properties:
      amount:
        type: string
      amount_raw:
        type: string
      block_hash:
        type: string
      block_num:
        type: integer
      contract:
        type: string
      from:
        $ref: '#/definitions/subscan_internal_plugin_spaceTime_db.HolderDisplay'
      id:
        type: integer
      log_index:
        type: integer
      method:
        type: string
      timestamp:
        type: integer
      to:
        $ref: '#/definitions/subscan_internal_plugin_spaceTime_db.HolderDisplay'
      transaction_hash:
        type: string
    type: object
  subscan_internal_plugin_share.J:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      generated_at:
        example: 1699600641
        type: integer
      message:
        example: Success
        type: string
    type: object
  subscan_internal_plugin_spaceTime_db.HolderDisplay:
    properties:
      address:
        type: string
      is_contract:
        type: boolean
      is_verified:
        type: boolean
      name:
        type: string
    type: object
  subscan_internal_plugin_spaceTime_db.Holder:
    properties:
      address:
        type: string
      balance:
        type: string
      is_contract:
        type: boolean
      is_verified:
        type: boolean
      name:
        type: string
    type: object
  internal_plugin_spaceTime_http.holderParams:
    properties:
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    type: object
