openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Currency API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Currency
paths:
  /api/open/currencies:
    post:
      description: Returns the supported currency codes that can be used for native-token price lookup and conversion.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        currencies:
                          items:
                            type: string
                          type: array
                      type: object
                  type: object
      summary: List supported native-token quote currencies
      tags:
      - Currency
      x-synonyms:
      - supported
      - currencies
      - currency
      - open
  /api/open/price:
    post:
      description: Returns the native-token price quote for the requested timestamp. Use this endpoint for historical token price lookup in supported quote currencies.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      $ref: '#/components/schemas/subscan_internal_service_scan.CurrencyPrice'
                  type: object
      summary: Get the native token price at a specific time
      tags:
      - Currency
      x-synonyms:
      - currency
      - price
      - open
      - rate
      - valuation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.currencyPriceParams'
        description: params
        required: true
  /api/open/price_converter:
    post:
      description: Converts a token amount from one supported currency into another using the price snapshot at the requested time. Returns both the converted output value and the quote data used for the calculation.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      $ref: '#/components/schemas/internal_server_http.CurrencyConverter'
                  type: object
      summary: Convert one token value between currencies
      tags:
      - Currency
      x-synonyms:
      - currency
      - price
      - converter
      - open
      - rate
      - valuation
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.currencyConverterParams'
        description: params
        required: true
components:
  schemas:
    subscan_internal_service_scan.CurrencyPrice:
      properties:
        price:
          type: string
        records:
          items:
            $ref: '#/components/schemas/subscan_internal_service_scan.PriceRecord'
          type: array
        time:
          type: integer
      type: object
    subscan_internal_service_scan.PriceRecord:
      properties:
        price:
          type: string
        time:
          type: integer
      type: object
    internal_server_http.currencyPriceParams:
      properties:
        base:
          type: string
        quote:
          enum:
          - USD
          type: string
        time:
          minimum: 1
          type: integer
      type: object
    internal_server_http.currencyConverterParams:
      properties:
        from:
          type: string
        quote:
          type: string
        time:
          type: integer
        value:
          type: string
      required:
      - from
      - quote
      - value
      type: object
    internal_server_http.CurrencyConverter:
      properties:
        output:
          type: string
        price:
          $ref: '#/components/schemas/subscan_internal_service_scan.CurrencyPrice'
      type: object
    internal_server_http.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
