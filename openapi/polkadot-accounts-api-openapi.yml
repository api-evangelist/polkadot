components:
  schemas:
    EraPayoutsData:
      type: object
      description: Actual payout data for an era
      required:
      - era
      - totalEraRewardPoints
      - totalEraPayout
      - payouts
      properties:
        era:
          type: string
          description: Era index
        payouts:
          type: array
          items:
            $ref: '#/components/schemas/ValidatorPayout'
          description: Individual payouts for validators nominated
        totalEraPayout:
          type: string
          description: Total payout for the era
        totalEraRewardPoints:
          type: string
          description: Total reward points for the era
    BlockInfo:
      type: object
      description: Block information
      required:
      - hash
      - height
      properties:
        hash:
          type: string
        height:
          type: string
    ProxyInfoResponse:
      type: object
      description: Response for GET /accounts/{accountId}/proxy-info
      required:
      - at
      - delegatedAccounts
      - depositHeld
      properties:
        ahTimestamp:
          type:
          - string
          - 'null'
        at:
          $ref: '#/components/schemas/BlockInfo'
        delegatedAccounts:
          type: array
          items:
            $ref: '#/components/schemas/ProxyDefinition'
          description: Array of delegated accounts with their proxy definitions
        depositHeld:
          type: string
          description: The deposit held for the proxies
        rcBlockHash:
          type:
          - string
          - 'null'
        rcBlockNumber:
          type:
          - string
          - 'null'
    RewardDestination:
      oneOf:
      - type: object
        description: Rewards are automatically re-staked
        required:
        - staked
        properties:
          staked:
            default: null
      - type: object
        description: Rewards are sent to the stash account
        required:
        - stash
        properties:
          stash:
            default: null
      - type: object
        description: Rewards are sent to the controller account
        required:
        - controller
        properties:
          controller:
            default: null
      - type: object
        description: No reward destination
        required:
        - none
        properties:
          none:
            default: null
      - type: object
        description: Rewards are sent to a specific account
        required:
        - account
        properties:
          account:
            type: string
            description: Rewards are sent to a specific account
      description: 'Reward destination - e.g. { "staked": null }, { "stash": null }, { "account": "..." }'
    BalanceLock:
      type: object
      description: Balance lock information
      required:
      - id
      - amount
      - reasons
      properties:
        amount:
          type: string
          description: Amount locked
        id:
          type: string
          description: Lock identifier
        reasons:
          type: string
          description: Lock reasons (Fee = 0, Misc = 1, All = 2)
    AssetBalancesResponse:
      type: object
      description: Response for GET /accounts/{accountId}/asset-balances
      required:
      - at
      - assets
      properties:
        ahTimestamp:
          type:
          - string
