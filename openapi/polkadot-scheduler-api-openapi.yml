openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Scheduler API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Scheduler
paths:
  /api/scan/scheduler:
    post:
      description: Returns a scheduled call detail by ID or by (when,index).
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      $ref: '#/components/schemas/subscan_internal_model.SchedulerDetailsJson'
                  type: object
      summary: Get scheduled call details
      tags:
      - Scheduler
      x-synonyms:
      - scheduled
      - call
      - scheduler
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.schedulersDetailsParams'
        description: params
        required: true
  /api/scan/schedulers:
    post:
      description: Returns paginated scheduled calls with module, status, and time-range filters.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      properties:
                        count:
                          type: integer
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_model.SchedulerJson'
                          type: array
                      type: object
                  type: object
      summary: List scheduled calls
      tags:
      - Scheduler
      x-synonyms:
      - scheduled
      - calls
      - scheduler
      - scan
      - schedulers
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.schedulersParams'
        description: params
        required: true
  /api/scan/schedulers/statistics:
    post:
      description: Returns aggregated scheduler statistics.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/internal_server_http.J'
                - properties:
                    data:
                      $ref: '#/components/schemas/subscan_internal_model.SchedulerStatisticsJson'
                  type: object
      summary: Get scheduler statistics
      tags:
      - Scheduler
      x-synonyms:
      - scheduler
      - statistics
      - scan
      - schedulers
components:
  schemas:
    subscan_internal_model.AccountDisplay:
      properties:
        account_index:
          type: string
        address:
          description: Current network account
          type: string
        display:
          type: string
        evm_address:
          type: string
        evm_contract:
          $ref: '#/components/schemas/subscan_internal_model.EvmAccountDisplay'
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        merkle:
          $ref: '#/components/schemas/subscan_internal_model.MerkleTag'
        parent:
          allOf:
          - $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
          description: Parent account
        people:
          $ref: '#/components/schemas/subscan_internal_model.SampleIdentity'
      type: object
    subscan_internal_model.ExtrinsicError:
      properties:
        batch_index:
          type: integer
        doc:
          type: string
        module:
          type: string
        name:
          type: string
        value:
          type: string
        version:
          type: integer
      type: object
    subscan_internal_model.MerkleTag:
      properties:
        address_type:
          type: string
        tag_name:
          type: string
        tag_subtype:
          type: string
        tag_type:
          type: string
      type: object
    internal_server_http.schedulersParams:
      properties:
        after_id:
          description: '[exec_time,id]'
          items:
            type: integer
          type: array
        block_range:
          type: string
        call:
          type: string
        end_date:
          type: string
        module:
          type: string
        page:
          description: Page number, starting from 0
          example: 0
          minimum: 0
          type: integer
        row:
          description: Data size per page
          example: 10
          maximum: 100
          minimum: 1
          type: integer
        start_date:
          type: string
        status:
          enum:
          - Scheduled
          - Cancel
          - CallUnavailable
          - Executed
          - ExecutedFailed
          type: string
      type: object
    subscan_internal_model.ExtrinsicSubCallJson:
      properties:
        account:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        exec_result:
          $ref: '#/components/schemas/subscan_libs_substrate.MetadataModuleError'
        exec_status:
          type: string
        module:
          type: string
        multisig:
          $ref: '#/components/schemas/subscan_internal_model.MultisigJson'
        name:
          type: string
        param: {}
        sub_calls:
          items:
            $ref: '#/components/schemas/subscan_internal_model.ExtrinsicSubCallJson'
          type: array
      type: object
    internal_server_http.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
    subscan_internal_model.EvmAccountDisplay:
      properties:
        contract_name:
          type: string
        verify_source:
          type: string
      type: object
    subscan_internal_model.SchedulerDetailsJson:
      properties:
        call_hash:
          type: string
        call_module:
          type: string
        call_name:
          type: string
        create_event_index:
          type: string
        exec_event_index:
          type: string
        id:
          type: integer
        index:
          type: integer
        origin: {}
        params:
          items:
            $ref: '#/components/schemas/subscan_internal_model.ExtrinsicParam'
          type: array
        priority:
          type: integer
        status:
          type: string
        sub_calls:
          items:
            $ref: '#/components/schemas/subscan_internal_model.ExtrinsicSubCallJson'
          type: array
        task_name:
          type: string
        timeline:
          items:
            $ref: '#/components/schemas/subscan_internal_model.TimelineJson'
          type: array
        when:
          type: integer
        when_timestamp:
          type: integer
      type: object
    subscan_internal_model.SampleIdentity:
      properties:
        display:
          type: string
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        parent:
          $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
      type: object
    subscan_internal_model.SchedulerStatisticsJson:
      properties:
        call_unavailable_count:
          type: integer
        cancel_count:
          type: integer
        executed_count:
          type: integer
        executed_failed_count:
          type: integer
        scheduled_count:
          type: integer
      type: object
    subscan_internal_model.MultisigJson:
      properties:
        call_hash:
          type: string
        call_module:
          type: string
        call_module_function:
          type: string
        error:
          $ref: '#/components/schemas/subscan_internal_model.ExtrinsicError'
        extrinsic_index:
          type: string
        multi_id:
          type: string
        multisig_account_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        multisig_status:
          $ref: '#/components/schemas/subscan_internal_model.MultiAction'
        processing:
          type: integer
        threshold:
          type: integer
      type: object
    subscan_internal_model.TimelineJson:
      properties:
        block:
          type: integer
        extrinsic_index:
          type: string
        index:
          type: integer
        params: {}
        prophecy:
          type: boolean
        status:
          type: string
        time:
          type: integer
      type: object
    subscan_internal_model.MultiAction:
      enum:
      - Approval
      - Executed
      - Cancelled
      - Failed
      type: string
      x-enum-varnames:
      - MultiActionApproval
      - MultiActionExecuted
      - MultiActionCancelled
      - MultiActionExecuteFailed
    subscan_internal_model.AccountParentJson:
      properties:
        address:
          type: string
        display:
          type: string
        identity:
          type: boolean
        sub_symbol:
          type: string
      type: object
    internal_server_http.schedulersDetailsParams:
      properties:
        id:
          minimum: 0
          type: integer
        index:
          minimum: 0
          type: integer
        when:
          minimum: 0
          type: integer
      type: object
    subscan_libs_substrate.MetadataModuleError:
      properties:
        doc:
          items:
            type: string
          type: array
        module:
          type: string
        name:
          type: string
        value:
          type: string
      type: object
    subscan_internal_model.RegistrationJudgementJson:
      properties:
        index:
          type: integer
        judgement:
          type: string
      type: object
    subscan_internal_model.ExtrinsicParam:
      properties:
        name:
          type: string
        type:
          type: string
        type_name:
          type: string
        value: {}
      type: object
    subscan_internal_model.SchedulerJson:
      properties:
        call_hash:
          type: string
        call_module:
          type: string
        call_name:
          type: string
        create_event_index:
          type: string
        exec_event_index:
          type: string
        id:
          type: integer
        index:
          type: integer
        origin: {}
        priority:
          type: integer
        status:
          type: string
        task_name:
          type: string
        when:
          type: integer
        when_timestamp:
          type: integer
      type: object
