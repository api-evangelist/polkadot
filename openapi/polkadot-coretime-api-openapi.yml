      description: Returns paginated workload summaries for the latest or specified region.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                  data:
                    properties:
                      count:
                        type: integer
                      list:
                        items:
                          $ref: '#/components/schemas/internal_pluginv2_pallets_coretime.CoreWorkLoadsJson'
                        type: array
