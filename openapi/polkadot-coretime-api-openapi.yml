components:
  schemas:
    internal_pluginv2_pallets_coretime.RegionPurchasedJson:
      properties:
        account:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        begin:
          type: integer
        block_num:
          type: integer
        block_timestamp:
          type: integer
        core:
          type: integer
        core_index:
          type: string
        end:
          type: integer
        event_index:
          type: string
        extrinsic_index:
          type: string
        mask:
          type: string
        price:
          type: string
        purchased_type:
          type: string
      type: object
    internal_pluginv2_pallets_coretime.purchasedParams:
      properties:
        core:
          example: 10
          minimum: 0
          type: integer
        page:
          description: Page number, starting from 0
          example: 0
          minimum: 0
          type: integer
        purchased_type:
          enum:
          - bulk
          - renewed
          type: string
        region_begin:
          description: Address       string `json:"address" form:"address" binding:"omitempty,addr"`
          example: 10
          minimum: 1
          type: integer
        row:
          description: Data size per page
          example: 10
          maximum: 1000
          minimum: 1
          type: integer
