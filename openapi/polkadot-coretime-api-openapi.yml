      - compute time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_pluginv2_pallets_coretime.workloadHistoryParams'
        description: params
        required: true
    servers:
    - url: https://https://www.subscan.io/
  /api/scan/broker/workloads:
