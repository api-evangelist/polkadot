                        type: array
                    type: object
                  message:
                    type: string
                type: object
      summary: List coretime sale history
      tags:
      - coretime
      x-synonyms:
      - coretime
      - sale
      - history
      - scan
      - broker
      - sales
      - core lease
      - compute time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_pluginv2_pallets_coretime.saleHistoryParams'
        description: params
        required: true
    servers:
    - url: https://https://www.subscan.io/
  /api/scan/broker/workload/details:
    post:
      description: Returns workload details for a region and requires either core or para_id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                properties:
                  code:
                    type: integer
                  data:
                    $ref: '#/components/schemas/internal_pluginv2_pallets_coretime.CoreWorkloadsPlansJson'
                  message:
                    type: string
                type: object
      summary: Get coretime workload details
      tags:
      - coretime
      x-synonyms:
      - coretime
      - workload
      - scan
      - broker
      - core lease
      - compute time
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_pluginv2_pallets_coretime.workloadDetailsParams'
        description: params
        required: true
    servers:
