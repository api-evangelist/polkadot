definitions:
  internal_plugin_enjin_multiTokens_http.EnjinMultiTokenItemParams:
    properties:
      collection_id:
        type: string
      token_id:
        type: string
    type: object
  subscan_internal_plugin_share.J:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      generated_at:
        example: 1699600641
        type: integer
      message:
        example: Success
        type: string
    type: object
  internal_plugin_enjin_multiTokens_http.EnjinMultiTokenActivitiesParams:
    properties:
      collection_id:
        description: multiToken collection id
        type: string
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
      token_id:
        description: Optional. filter by token id
        type: string
    type: object
  internal_plugin_enjin_multiTokens_http.EnjinMultiTokenHoldersParams:
    properties:
      collection_id:
        description: multiToken collection id
        type: string
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
      token_id:
        description: optional. filter by token id
        type: string
    required:
    - collection_id
    type: object
  internal_plugin_enjin_multiTokens_http.EnjinMultiTokenParams:
    properties:
      collection_id:
        description: Optional, multiToken collection id
        type: string
      order:
        description: Optional, order sort, default desc
        enum:
        - desc
        - asc
        type: string
      order_field:
        description: Optional, order field
        enum:
        - items
        - holders
        - collection_id
        - transfer_count
        type: string
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
      search:
        description: Optional, multiToken collection name
        maxLength: 256
        minLength: 1
        type: string
    type: object
  internal_plugin_enjin_multiTokens_http.EnjinMultiTokeInfoParams:
    properties:
