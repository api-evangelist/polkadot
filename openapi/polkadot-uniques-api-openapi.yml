openapi: 3.2.0
info:
  contact:
    email: bruce.sun@itering.io
    name: API Support
    url: http://www.swagger.io/support
  description: This is a subscan API server.
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Subscan Uniques API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Uniques
paths:
  /api/scan/uniques/account/balances:
    post:
      description: Returns paginated unique item balances for an account.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List unique balances by account
      tags:
      - Uniques
      x-synonyms:
      - unique
      - balances
      - account
      - uniques
      - scan
      - wallet
      - address
      - user
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.UniquesBalancesParams'
        description: param
        required: true
  /api/scan/uniques/activities:
    post:
      description: Returns paginated activity records for a unique collection and optional item.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List unique collection activities
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collection
      - activities
      - uniques
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.UniquesActivitiesParams'
        description: param
        required: true
  /api/scan/uniques/all:
    get:
      description: Returns all unique collections without pagination.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List all unique collections
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collections
      - uniques
      - scan
  /api/scan/uniques/unique:
    post:
      description: Returns details for a unique collection by collection_id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get unique collection details
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collection
      - uniques
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.uniqueParam'
        description: param
        required: true
  /api/scan/uniques/unique/holders:
    post:
      description: Returns paginated holder distribution for a unique collection.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List unique collection holders
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collection
      - holders
      - uniques
      - scan
      - owners
      - token holders
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.UniquesHoldersParams'
        description: param
        required: true
  /api/scan/uniques/unique/item:
    post:
      description: Returns details for a unique collection item by collection_id and item_id.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: Get unique item details
      tags:
      - Uniques
      x-synonyms:
      - unique
      - item
      - uniques
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.uniqueItemParams'
        description: param
        required: true
  /api/scan/uniques/unique/items:
    post:
      description: Returns paginated items in a unique collection with optional owner filter.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/subscan_internal_plugin_share.J'
                - properties:
                    data:
                      properties:
                        count:
                          type: integer
                        list:
                          items:
                            $ref: '#/components/schemas/subscan_internal_plugin_uniques_db.ItemSample'
                          type: array
                      type: object
                  type: object
      summary: List unique collection items
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collection
      - items
      - uniques
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.uniqueItemsParams'
        description: param
        required: true
  /api/scan/uniques/uniques:
    post:
      description: Returns a paginated list of unique collections.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
      summary: List unique collections
      tags:
      - Uniques
      x-synonyms:
      - unique
      - collections
      - uniques
      - scan
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_plugin_uniques_http.uniquesListParam'
        description: param
        required: true
components:
  schemas:
    subscan_internal_model.SampleIdentity:
      properties:
        display:
          type: string
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        parent:
          $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
      type: object
    internal_plugin_uniques_http.uniquesListParam:
      properties:
        collection_id:
          type: string
        order:
          description: Optional, order sort, default desc
          enum:
          - desc
          - asc
          type: string
        order_field:
          description: Optional, order field
          enum:
          - collection_id
          - items
          - holders
          - transfer_count
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
        search:
          description: uniques name
          maxLength: 256
          minLength: 1
          type: string
      type: object
    subscan_internal_model.AccountParentJson:
      properties:
        address:
          type: string
        display:
          type: string
        identity:
          type: boolean
        sub_symbol:
          type: string
      type: object
    subscan_internal_model.EvmAccountDisplay:
      properties:
        contract_name:
          type: string
        verify_source:
          type: string
      type: object
    subscan_internal_model.StandardMetadata:
      properties:
        attributes: {}
        decode_attrs:
          items: {}
          type: array
        description:
          example: Thanks
          type: string
        external_url:
          example: https://beta.nft.io/my-collections
          type: string
        fallback_image:
          type: string
        image:
          example: https://ipfs.io/ipfs/bafkreihmb2esqysriq46l2uutyu2bqxkzlgluarbr36kom3hrykd2ku42u
          type: string
        local_image:
          type: string
        media:
          items:
            $ref: '#/components/schemas/subscan_internal_model.MetadataMedia'
          type: array
        name:
          example: 500 Followers
          type: string
        symbol:
          example: PKG
          type: string
        thumbnail:
          type: string
      type: object
    subscan_internal_plugin_share.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
    internal_plugin_uniques_http.UniquesActivitiesParams:
      properties:
        collection_id:
          type: string
        item_id:
          type: integer
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    internal_plugin_uniques_http.uniqueParam:
      properties:
        collection_id:
          type: string
      type: object
    internal_plugin_uniques_http.uniqueItemParams:
      properties:
        collection_id:
          type: string
        item_id:
          type: integer
      type: object
    subscan_internal_model.AccountDisplay:
      properties:
        account_index:
          type: string
        address:
          description: Current network account
          type: string
        display:
          type: string
        evm_address:
          type: string
        evm_contract:
          $ref: '#/components/schemas/subscan_internal_model.EvmAccountDisplay'
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        merkle:
          $ref: '#/components/schemas/subscan_internal_model.MerkleTag'
        parent:
          allOf:
          - $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
          description: Parent account
        people:
          $ref: '#/components/schemas/subscan_internal_model.SampleIdentity'
      type: object
    internal_plugin_uniques_http.UniquesBalancesParams:
      properties:
        address:
          example: EaBRZ3VBUFEd6GT9kxXXk9C5gsYC6zAsNfxahmpusrYPtPf
          type: string
        collection_id:
          example: '1'
          type: string
        page:
          example: 0
          minimum: 0
          type: integer
        row:
          example: 10
          maximum: 100
          minimum: 1
          type: integer
      required:
      - address
      type: object
    internal_plugin_uniques_http.UniquesHoldersParams:
      properties:
        collection_id:
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    internal_plugin_uniques_http.uniqueItemsParams:
      properties:
        collection_id:
          type: string
        order:
          description: Optional, order sort, default desc
          enum:
          - desc
          - asc
          type: string
        order_field:
          description: Optional, order field
          enum:
          - item_id
          - create_at
          - transfer_count
          type: string
        owner:
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    subscan_internal_model.MerkleTag:
      properties:
        address_type:
          type: string
        tag_name:
          type: string
        tag_subtype:
          type: string
        tag_type:
          type: string
      type: object
    subscan_internal_model.MetadataMedia:
      properties:
        types:
          type: string
        url:
          type: string
      type: object
    subscan_internal_plugin_uniques_db.ItemSample:
      properties:
        collection_id:
          type: string
        collection_name:
          type: string
        item_id:
          type: integer
        metadata:
          $ref: '#/components/schemas/subscan_internal_model.StandardMetadata'
        owner:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        transfer_count:
          type: integer
      type: object
    subscan_internal_model.RegistrationJudgementJson:
      properties:
        index:
          type: integer
        judgement:
          type: string
      type: object
