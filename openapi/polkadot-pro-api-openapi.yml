openapi: 3.1.0
info:
  title: Polkadot REST Account PRO API
  description: High-performance Rust REST API for Substrate/Polkadot blockchain data. Drop-in replacement for substrate-api-sidecar.
  contact:
    url: https://github.com/paritytech/polkadot-rest-api
  license:
    name: GPL-3.0-or-later
  version: 0.1.3
servers:
- url: http://localhost:8080/v1
  description: Localhost
tags:
- description: Pro-only endpoints require a Subscan Pro plan.
  name: PRO
paths:
  /api/scan/multiChain/account/count:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns the number of multichain asset records associated with one account.

        Support Network: polkadot'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.multiChainAccountParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  type: integer
              type: object
      summary: '[PRO] Count multichain account assets'
      tags:
      - PRO
      x-synonyms:
      - multichain
      - account
      - count
      - scan
      - wallet
      - address
      - user
  /api/scan/multiChain/balance_value_history:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns the historical total balance value for one account over the requested date range. Dates use the format YYYY-MM-DD.

        Support Network: polkadot'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.accountBalanceValueHistoryParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/subscan_internal_dao.AccountBalanceValueHistory'
                  type: array
              type: object
      summary: '[PRO] Get multichain account balance-value history'
      tags:
      - PRO
      x-synonyms:
      - account
      - balance
      - value
      - history
      - multichain
      - scan
      - wallet
      - address
      - user
  /api/scan/multiChain/balance_value_stat:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns the maximum, minimum, and previous-24-hour balance values for one account.

        Support Network: polkadot'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.accountBalanceValueStatParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    asset_max:
                      type: number
                    asset_min:
                      type: number
                    asset_prev24H:
                      type: number
                    max:
                      type: number
                    min:
                      type: number
                    prev24H:
                      type: number
                  type: object
              type: object
      summary: '[PRO] Get multichain account balance-value statistics'
      tags:
      - PRO
      x-synonyms:
      - account
      - balance
      - value
      - stat
      - multichain
      - scan
      - wallet
      - address
      - user
  /api/scan/multiChain/price:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns the available multichain price data, optionally including price-change information.

        Support Network: polkadot'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.identitiesParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  additionalProperties: true
                  type: object
              type: object
      summary: '[PRO] List multichain price snapshots'
      tags:
      - PRO
      x-synonyms:
      - multichain
      - price
      - scan
      - rate
      - valuation
  /api/scan/xcm/bridge_stat:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns bridge-type XCM statistics grouped by time format.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.BridgeStatParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  additionalProperties:
                    items:
                      $ref: '#/definitions/subscan_internal_model.BridgeStatStatJson'
                    type: array
                  type: object
              type: object
      summary: '[PRO] Get XCM bridge statistics'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - bridge
      - statistics
      - pro
      - scan
      - stat
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/channel:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns one XCM/HRMP channel by sender and recipient parachain IDs.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmChannelInfoParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  $ref: '#/definitions/subscan_internal_model.HrmpChannel'
              type: object
      summary: '[PRO] Get XCM channel details'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - channel
      - pro
      - scan
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/channels:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns XCM/HRMP channel list filtered by sender, recipient, status, or para_id.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmChannelParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_model.HrmpChannel'
                      type: array
                  type: object
              type: object
      summary: '[PRO] List XCM channels'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - channels
      - pro
      - scan
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/check_hash:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns the XCM message unique ID from origin or destination event/hash inputs.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmHashParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  type: string
              type: object
      summary: '[PRO] Find XCM message ID by hash'
      tags:
      - PRO
      x-synonyms:
      - find
      - xcm
      - message
      - id
      - hash
      - pro
      - scan
      - check
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/info:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns detailed information for one XCM message by unique_id or origin identifiers.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmMessageDetailParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  $ref: '#/definitions/subscan_internal_model.ParaXcmMessageJson'
              type: object
      summary: '[PRO] Get XCM message details'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - message
      - pro
      - scan
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/list:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns paginated XCM messages with protocol, status, asset, and block-range filters.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmMessageParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_model.ParaXcmMessageJson'
                      type: array
                  type: object
              type: object
      summary: '[PRO] List XCM messages'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - messages
      - pro
      - scan
      - cross-chain
      - cross chain
      - bridge message
  /api/scan/xcm/meta:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns XCM metadata and parachain statistics, optionally filtered by para_id.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmMetaParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  $ref: '#/definitions/subscan_internal_model.XcmMeta'
              type: object
      summary: '[PRO] Get XCM metadata'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - metadata
      - pro
      - scan
      - meta
      - cross-chain
      - cross chain
      - bridge message
      - chain info
  /api/scan/xcm/parachain/stat:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns XCM parachain send/receive statistics with optional direction and date filters.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.xcmSenderStatParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/subscan_internal_model.XcmMessageCountStatJson'
                  type: array
              type: object
      summary: '[PRO] Get XCM parachain statistics'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - parachain
      - statistics
      - pro
      - scan
      - stat
      - cross-chain
      - cross chain
      - bridge message
      - para chain
      - relaychain shard
  /api/scan/xcm/stat:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns XCM traffic statistics for a date range and optional parachain filter.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmStatParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    all:
                      items:
                        $ref: '#/definitions/subscan_internal_model.XcmMessageStatJson'
                      type: array
                    receiver:
                      items:
                        $ref: '#/definitions/subscan_internal_model.XcmMessageStatJson'
                      type: array
                    send:
                      items:
                        $ref: '#/definitions/subscan_internal_model.XcmMessageStatJson'
                      type: array
                  type: object
              type: object
      summary: '[PRO] Get XCM statistics'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - statistics
      - pro
      - scan
      - stat
      - cross-chain
      - cross chain
      - bridge message
  /api/v2/scan/accounts/net_assets:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/) Returns a paginated account-level net-asset leaderboard. Native-only networks read directly from chain_accounts; other networks use pre-aggregated priced fungible-token snapshots.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.accountNetAssetsParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_model.AccountNetAssetJson'
                      type: array
                  type: object
              type: object
      summary: '[PRO] List accounts by net assets'
      tags:
      - PRO
      x-synonyms:
      - accounts
      - net assets
      - wealth
      - leaderboard
      - wallet
      - token value
  /api/v2/scan/multiChain/account:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a [Pro plan](http://pro.subscan.io/). Returns aggregated multichain asset balances for one account together with related DeFi participation data.

        Support Network: polkadot'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.multiChainAccountParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    assets:
                      items:
                        $ref: '#/definitions/subscan_internal_model.AssetsJson'
                      type: array
                    defi:
                      $ref: '#/definitions/subscan_internal_service_scan.DefiJson'
                  type: object
              type: object
      summary: '[PRO] Get multichain account assets'
      tags:
      - PRO
      x-synonyms:
      - multichain
      - account
      - scan
      - wallet
      - address
      - user
  /api/v2/scan/xcm/list:
    post:
      consumes:
      - application/json
      description: '**PRO API**: Requires a Pro plan. Returns paginated XCM messages with protocol, status, asset, and block-range filters.'
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_server_http.XcmMessageV2Params'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/internal_server_http.J'
            - properties:
                data:
                  properties:
                    count:
                      type: integer
                    daily:
                      items:
                        $ref: '#/definitions/subscan_internal_model.ParaXcmMessageTokenDailyCountJson'
                      type: array
                    list:
                      items:
                        $ref: '#/definitions/subscan_internal_model.ParaXcmMessageJson'
                      type: array
                    total:
                      items:
                        $ref: '#/definitions/subscan_internal_model.ParaXcmMessageTokenTotalJson'
                      type: array
                  type: object
              type: object
      summary: '[PRO] List XCM messages'
      tags:
      - PRO
      x-synonyms:
      - xcm
      - messages
      - pro
      - scan
      - cross-chain
      - cross chain
      - bridge message
definitions:
  subscan_internal_model.AccountParentJson:
    properties:
      address:
        type: string
      display:
        type: string
      identity:
        type: boolean
      sub_symbol:
        type: string
    type: object
  subscan_internal_model.MultiAssets:
    properties:
      amount:
        type: string
      asset_module:
        type: string
      asset_unique_id:
        type: string
      current_currency_amount:
        type: string
      decimals:
        type: integer
      enum_key:
        type: string
      history_currency_amount:
        type: string
      network:
        type: string
      raw: {}
      symbol:
        type: string
      version:
        type: string
    type: object
  internal_server_http.XcmMessageDetailParams:
    properties:
      origin_event_id:
        description: sender event id, need with origin_para_id
        type: string
      origin_para_id:
        description: sender parachain id, need with origin_event_id
        type: integer
      unique_id:
        description: unique id of the message
        type: string
    type: object
  internal_server_http.J:
    properties:
      code:
        example: 0
        type: integer
      data: {}
      generated_at:
        example: 1699600641
        type: integer
      message:
        example: Success
        type: string
    type: object
  subscan_internal_model.XcmMessageStatJson:
    properties:
      message_total:
        type: integer
      time_utc:
        type: string
      total:
        type: integer
    type: object
  subscan_internal_model.XcmErrorMsg:
    properties:
      doc:
        type: string
      name:
        type: string
    type: object
  subscan_internal_model.XcmMessageCountStatJson:
    properties:
      message_total:
        type: integer
      recipient:
        type: integer
      sender:
        type: integer
      transfer_total:
        type: integer
    type: object
  subscan_internal_model.ParaXcmMessageTokenDailyCountJson:
    properties:
      count:
        type: integer
      time:
        type: string
    type: object
  subscan_internal_model.AccountDisplay:
    properties:
      account_index:
        type: string
      address:
        description: Current network account
        type: string
      display:
        type: string
      evm_address:
        type: string
      evm_contract:
        $ref: '#/definitions/subscan_internal_model.EvmAccountDisplay'
      identity:
        type: boolean
      judgements:
        items:
          $ref: '#/definitions/subscan_internal_model.RegistrationJudgementJson'
        type: array
      merkle:
        $ref: '#/definitions/subscan_internal_model.MerkleTag'
      parent:
        allOf:
        - $ref: '#/definitions/subscan_internal_model.AccountParentJson'
        description: Parent account
      people:
        $ref: '#/definitions/subscan_internal_model.SampleIdentity'
    type: object
  subscan_internal_service_scan.DefiLoopStake:
    properties:
      bonded:
        type: string
      price:
        type: string
      token_unique_id:
        type: string
      unbonding:
        type: string
    type: object
  internal_server_http.accountBalanceValueStatParams:
    properties:
      address:
        type: string
    required:
    - address
    type: object
  subscan_internal_model.MerkleTag:
    properties:
      address_type:
        type: string
      tag_name:
        type: string
      tag_subtype:
        type: string
      tag_type:
        type: string
    type: object
  subscan_internal_model.ExtrinsicParam:
    properties:
      name:
        type: string
      type:
        type: string
      type_name:
        type: string
      value: {}
    type: object
  subscan_internal_model.SampleIdentity:
    properties:
      display:
        type: string
      identity:
        type: boolean
      judgements:
        items:
          $ref: '#/definitions/subscan_internal_model.RegistrationJudgementJson'
        type: array
      parent:
        $ref: '#/definitions/subscan_internal_model.AccountParentJson'
    type: object
  internal_server_http.XcmChannelParams:
    properties:
      filter_para_id:
        description: filter by parachain id(sender or recipient)
        minimum: 1
        type: integer
      recipient:
        description: HRMP recipient parachain id
        minimum: 1
        type: integer
      sender:
        description: HRMP sender parachain id
        minimum: 1
        type: integer
      status:
        description: filter by status
        enum:
        - closed
        - accepted
        - canceled
        - requested
        type: string
    type: object
  subscan_internal_dao.AccountBalanceValueHistory:
    properties:
      asset_value:
        type: string
      date:
        type: string
      defi_value:
        type: string
      value:
        type: string
    type: object
  internal_server_http.multiChainAccountParams:
    properties:
      address:
        type: string
    required:
    - address
    type: object
  subscan_internal_service_scan.DefiNominationPool:
    properties:
      SENJ_amount:
        type: string
      bonded:
        type: string
      network:
        type: string
      token_unique_id:
        type: string
      unbonding:
        type: string
      unclaimed:
        type: string
    type: object
  internal_server_http.accountBalanceValueHistoryParams:
    properties:
      address:
        type: string
      end:
        type: string
      start:
        type: string
    required:
    - address
    - end
    - start
    type: object
  subscan_internal_service_scan.DefiBifrost:
    properties:
      farming:
        items:
          $ref: '#/definitions/subscan_internal_service_scan.DefiBifrostFarming'
        type: array
      liquid_staking:
        items:
          $ref: '#/definitions/subscan_internal_service_scan.DefiLiquidStaking'
        type: array
      loop_stake:
        items:
          $ref: '#/definitions/subscan_internal_service_scan.DefiLoopStake'
        type: array
    type: object
  subscan_internal_model.HrmpChannel:
    properties:
      active_at:
        type: integer
      message_count:
        type: integer
      proposed_max_capacity:
        type: integer
      proposed_max_message_size:
        type: integer
      recipient:
        type: integer
      sender:
        type: integer
      status:
        type: string
      transfer_count:
        type: integer
    type: object
  internal_server_http.xcmSenderStatParams:
    properties:
      direction:
        enum:
        - in
        - out
        type: string
      end:
        description: 'end date, format: 2006-01-02'
        type: string
      filter_para_id:
        description: filter by parachain id, optional，if filter_para_id =-1 ，return all parachain send stat
        minimum: -1
        type: integer
      start:
        description: 'start date, format: 2006-01-02'
        type: string
    type: object
  subscan_internal_model.ExecutionFee:
    properties:
      asset_unique_id:
        type: string
      decimals:
        type: integer
      estimate_fee:
        type: string
      symbol:
        type: string
    type: object
  subscan_internal_model.EvmAccountDisplay:
    properties:
      contract_name:
        type: string
      verify_source:
        type: string
    type: object
  subscan_internal_service_scan.StakingV2:
    properties:
      network:
        type: string
      token_unique_id:
        type: string
      unclaimed:
        type: string
    type: object
