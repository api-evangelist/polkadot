openapi: 3.1.0
info:
  title: Polkadot REST Account NominationPools API
  description: High-performance Rust REST API for Substrate/Polkadot blockchain data. Drop-in replacement for substrate-api-sidecar.
  contact:
    url: https://github.com/paritytech/polkadot-rest-api
  license:
    name: GPL-3.0-or-later
  version: 0.1.3
servers:
- url: http://localhost:8080/v1
  description: Localhost
tags:
- name: NominationPools
paths:
  /api/scan/nomination_pool/activities:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsActivitiesParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools Activities
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - activities
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - nomination pool
  /api/scan/nomination_pool/pool:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsInfoParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools Info
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - nomination pool
  /api/scan/nomination_pool/pool/member/vote:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsMemberVoteParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools Member Vote
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - member
      - vote
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - nomination pool
  /api/scan/nomination_pool/pool/members:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsMembersParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools Members
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - members
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - nomination pool
  /api/scan/nomination_pool/pools:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsListParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools List
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - nomination pool
  /api/scan/nomination_pool/rewards:
    post:
      consumes:
      - application/json
      description: This API only supports networks with nominationPools frame
      parameters:
      - description: params
        in: body
        name: params
        required: true
        schema:
          $ref: '#/definitions/internal_pluginv2_pallets_nominationPool.nominationPoolsRewardsParams'
      produces:
      - application/json
      responses:
        '200':
          description: OK
          schema: {}
      summary: Nomination Pools Rewards
      tags:
      - NominationPools
      x-synonyms:
      - nomination
      - pools
      - rewards
      - nominationpools
      - scan
      - pool
      - staking pool
      - delegation
      - reward
      - payout
      - nomination pool
definitions:
  internal_pluginv2_pallets_nominationPool.nominationPoolsListParams:
    properties:
      multi_state:
        items:
          type: string
        type: array
      state:
        enum:
        - Destroying
        - Open
        - Blocked
        - Destroyed
        type: string
    type: object
  internal_pluginv2_pallets_nominationPool.nominationPoolsActivitiesParams:
    properties:
      page:
        minimum: 0
        type: integer
      pool_id:
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  internal_pluginv2_pallets_nominationPool.nominationPoolsRewardsParams:
    properties:
      address:
        type: string
      page:
        minimum: 0
        type: integer
      pool_id:
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  internal_pluginv2_pallets_nominationPool.nominationPoolsMemberVoteParams:
    properties:
      address:
        type: string
    required:
    - address
    type: object
  internal_pluginv2_pallets_nominationPool.nominationPoolsMembersParams:
    properties:
      page:
        minimum: 0
        type: integer
      pool_id:
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    required:
    - row
    type: object
  internal_pluginv2_pallets_nominationPool.nominationPoolsInfoParams:
    properties:
      pool_id:
        type: integer
    type: object
