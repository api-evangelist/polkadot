  title: Subscan Search API
  version: '1.0'
servers:
- url: https://https://www.subscan.io/
tags:
- name: Search
paths:
  /api/scan/check_hash:
    post:
      description: Resolves the supplied hash and returns the detected object type, such as account, extrinsic, EVM transaction, block, XCM message, or multisig call hash, together with any matching identifiers.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema: {}
      summary: Identify the object type for a hash
      tags:
      - Search
      x-synonyms:
      - check
      - hash
      - type
      - search
      - scan
      - lookup
      - find
      - query
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/internal_server_http.checkHashParam'
        description: param
        required: true
components:
  schemas:
    internal_server_http.checkHashParam:
      properties:
        hash:
          type: string
      type: object
