        block_num:
          minimum: 1
          type: integer
      type: object
    internal_plugin_evm_http.EVMAccountTokensParam:
      properties:
        address:
          type: string
      required:
      - address
      type: object
    subscan_internal_plugin_evm_db.TokenTransferJson:
      properties:
        category:
          type: string
        contract:
          type: string
        create_at:
          type: integer
        decimals:
          type: integer
        from:
          type: string
        from_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        hash:
          type: string
        id:
          type: integer
        index:
          type: integer
        name:
          type: string
        price:
          type: string
        pvm:
          type: boolean
        storage_url:
          type: string
        symbol:
          type: string
        to:
          type: string
        to_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        token_id:
          type: string
        value:
          $ref: '#/components/schemas/subscan_internal_plugin_evm_db.EvmBalance'
      type: object
    internal_plugin_evm_http.EtherscanResponse:
      properties:
        message:
          description: '"OK" for success, error message for failure'
          type: string
        result:
          description: Actual data or error description
        status:
          description: '"1" for success, "0" for error'
          type: string
      type: object
    subscan_internal_plugin_evm_db.TraceJson:
      properties:
        block_num:
          type: integer
        create_at:
          type: integer
        from_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        hash:
          type: string
        id:
          type: integer
        to_display:
          $ref: '#/components/schemas/subscan_internal_model.AccountDisplay'
        value:
          type: string
      type: object
    subscan_internal_model.SampleIdentity:
      properties:
