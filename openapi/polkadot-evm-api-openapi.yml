definitions:
  subscan_internal_plugin_evm_db.TokenTransferJson:
    properties:
      category:
        type: string
      contract:
        type: string
      create_at:
        type: integer
      decimals:
        type: integer
      from:
        type: string
      from_display:
        $ref: '#/definitions/subscan_internal_model.AccountDisplay'
      hash:
        type: string
      id:
        type: integer
      index:
        type: integer
      name:
        type: string
      price:
        type: string
      pvm:
        type: boolean
      storage_url:
        type: string
      symbol:
        type: string
      to:
        type: string
      to_display:
        $ref: '#/definitions/subscan_internal_model.AccountDisplay'
      token_id:
        type: string
      value:
        $ref: '#/definitions/subscan_internal_plugin_evm_db.EvmBalance'
    type: object
  subscan_internal_model.AccountParentJson:
    properties:
      address:
        type: string
      display:
        type: string
      identity:
        type: boolean
      sub_symbol:
        type: string
    type: object
  internal_plugin_evm_http.EVMBlockParam:
    properties:
      block_num:
        minimum: 1
        type: integer
    type: object
  internal_plugin_evm_http.EvmEventLogsParams:
    properties:
      address:
        example: 442172007806579794521170102470079356214135847138
        type: string
      block_range:
        example: 400000-400001
        type: string
      hash:
        type: string
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  internal_plugin_evm_http.EVMAccountTokensParam:
    properties:
      address:
        type: string
    required:
    - address
    type: object
  internal_plugin_evm_http.EvmErc1155CollectibleParam:
    properties:
      contract:
        type: string
      token_id:
        type: string
    required:
    - token_id
    type: object
  internal_plugin_evm_http.EvmTransactionsParam:
    properties:
      address:
        type: string
      after_id:
        type: integer
      block_num:
        minimum: 1
        type: integer
      block_range:
        type: string
      contract:
        type: string
      direction:
        default: from
        enum:
        - from
        - to
        - all
        type: string
      page:
        minimum: 0
        type: integer
      receiver:
        type: string
      row:
        maximum: 100
        minimum: 1
        type: integer
      sender:
        type: string
      success:
        type: boolean
    type: object
  internal_plugin_evm_http.EvmInternalTxParam:
    properties:
      address:
        type: string
      after_id:
        description: example:"[response.id]"
        type: integer
      hash:
        type: string
      page:
        minimum: 0
        type: integer
      row:
        maximum: 100
        minimum: 1
        type: integer
    type: object
  internal_plugin_evm_http.EVMTransactionParam:
    properties:
      extrinsic_index:
        description: Optional, ExtrinsicIndex, such as 4780334-2
        example: 4780334-2
        type: string
      hash:
        description: Optional, Also known as Transaction ID (TxID).
        example: 4403810828170396786290491371397686440048847949327459862756503144457611133612
        type: string
    type: object
  subscan_internal_model.AccountDisplay:
    properties:
      account_index:
        type: string
      address:
        description: Current network account
        type: string
      display:
        type: string
      evm_address:
        type: string
      evm_contract:
        $ref: '#/definitions/subscan_internal_model.EvmAccountDisplay'
      identity:
        type: boolean
      judgements:
        items:
          $ref: '#/definitions/subscan_internal_model.RegistrationJudgementJson'
        type: array
      merkle:
        $ref: '#/definitions/subscan_internal_model.MerkleTag'
      parent:
        allOf:
        - $ref: '#/definitions/subscan_internal_model.AccountParentJson'
        description: Parent account
      people:
