        row:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    internal_plugin_evm_http.EvmAbiSearchParams:
      properties:
        id:
          items:
            type: string
          type: array
      required:
      - id
      type: object
    internal_plugin_evm_http.EVMTransactionParam:
      properties:
        extrinsic_index:
          description: Optional, ExtrinsicIndex, such as 4780334-2
          example: 4780334-2
          type: string
        hash:
          description: Optional, Also known as Transaction ID (TxID).
          example: 4403810828170396786290491371397686440048847949327459862756503144457611133612
          type: string
      type: object
    subscan_internal_model.AccountParentJson:
      properties:
        address:
          type: string
        display:
          type: string
        identity:
          type: boolean
        sub_symbol:
          type: string
      type: object
    internal_plugin_evm_http.EvmInternalTxParam:
      properties:
        address:
          type: string
        after_id:
          description: example:"[response.id]"
          type: integer
        hash:
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
      type: object
    internal_plugin_evm_http.EvmContractListParam:
      properties:
        contract_type:
          description: contract type filter, only available in assethub network
          enum:
          - evm
          - pvm
          type: string
        contracts:
          items:
            type: string
          type: array
        order:
          enum:
          - desc
          - asc
          type: string
        order_field:
          enum:
          - verify_time
          - transaction_count
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
        search:
          maxLength: 256
          minLength: 1
          type: string
        verified:
          type: boolean
      type: object
    subscan_internal_model.AccountDisplay:
      properties:
        account_index:
          type: string
        address:
          description: Current network account
          type: string
        display:
          type: string
        evm_address:
          type: string
        evm_contract:
          $ref: '#/components/schemas/subscan_internal_model.EvmAccountDisplay'
        identity:
          type: boolean
        judgements:
          items:
            $ref: '#/components/schemas/subscan_internal_model.RegistrationJudgementJson'
          type: array
        merkle:
          $ref: '#/components/schemas/subscan_internal_model.MerkleTag'
        parent:
          allOf:
          - $ref: '#/components/schemas/subscan_internal_model.AccountParentJson'
          description: Parent account
        people:
          $ref: '#/components/schemas/subscan_internal_model.SampleIdentity'
      type: object
    subscan_internal_model.RegistrationJudgementJson:
      properties:
        index:
          type: integer
        judgement:
          type: string
      type: object
    internal_plugin_evm_http.EvmTokensParam:
      properties:
        category:
          enum:
          - erc20
          - erc721
          - erc1155
          - nft
          type: string
        contracts:
          items:
            type: string
          type: array
        order:
          enum:
          - desc
          - asc
          type: string
        order_field:
          enum:
          - holders
          - transfer_count
          - symbol
          type: string
        page:
          minimum: 0
          type: integer
        row:
          maximum: 100
          minimum: 1
          type: integer
        search:
          maxLength: 256
          minLength: 1
          type: string
      type: object
    subscan_internal_model.EvmAccountDisplay:
      properties:
        contract_name:
          type: string
        verify_source:
          type: string
      type: object
    subscan_internal_plugin_share.J:
      properties:
        code:
          example: 0
          type: integer
        data: {}
        generated_at:
          example: 1699600641
          type: integer
        message:
          example: Success
          type: string
      type: object
    internal_plugin_evm_http.EvmContractParam:
      properties:
        address:
          type: string
      required:
      - address
      type: object
    internal_plugin_evm_http.EVMBlockParam:
